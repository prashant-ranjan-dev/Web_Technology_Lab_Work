<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Details Form</title>
  <link rel="stylesheet" href="labWork5.css" />
</head>
<body>
  <div class="container">
    <h1>Employee Details</h1>

    <form id="employeeForm">
      <div class="field">
        <label for="employeeId">Employee ID</label>
        <input type="text" id="employeeId" name="employee_id" placeholder="E-1001" required />
      </div>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required />
      </div>

      <div class="field">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">Select Department</option>
          <option value="HR">HR</option>
          <option value="IT">IT</option>
          <option value="Finance">Finance</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
        </select>
      </div>

      <div class="field">
        <label for="position">Position</label>
        <input type="text" id="position" name="position" placeholder="Software Engineer" required />
      </div>

      <div class="field">
        <label for="salary">Salary</label>
        <input type="number" id="salary" name="salary" placeholder="50000" min="0" required />
      </div>

      <div class="field">
        <label for="joiningDate">Joining Date</label>
        <input type="date" id="joiningDate" name="joining_date" required />
      </div>

      <div class="field full-width">
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Enter full address" required></textarea>
      </div>

      <button type="submit">Save Employee Details</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <div id="popupModal" class="popup-modal" aria-live="polite">
    <div class="popup-content">
      <span id="popupClose" class="popup-close">&times;</span>
      <h2 id="popupTitle">Status</h2>
      <p id="popupText">Processing...</p>
      <button id="popupButton" type="button">OK</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="labWork5.js"></script>
 
</body>
</html>
